<!-- Shell raíz con navegación SPA -->
<nav>
  <a routerLink="/" routerLinkActive="activo">Inicio</a> |
  <a routerLink="/binding" routerLinkActive="activo">Binding</a> |
  <a routerLink="/control-flow" routerLinkActive="activo">Control Flow</a> |
  <a routerLink="/pipes-directivas" routerLinkActive="activo">Pipes y Directivas</a> |
  <a routerLink="/signals" routerLinkActive="activo">Signals</a> |
  <a routerLink="/io" routerLinkActive="activo">Input/Output</a> |
  <a routerLink="/servicios" routerLinkActive="activo">Servicios</a> |
  <a routerLink="/http" routerLinkActive="activo">HTTP</a> |
  <a routerLink="/admin" routerLinkActive="activo">Admin 🔒</a>

  <span class="spacer"></span>

  <!-- Login/Logout controlado por el servicio Auth -->
  @if (auth.logueado()) {
    <span>{{ auth.usuario() }}</span>
    <button (click)="auth.logOut()">Salir</button>
  } @else {
    <input #usuarioInput placeholder="Tu nombre" />
    <button (click)="auth.logIn(usuarioInput.value)">Entrar</button>
  }
</nav>

<main>
  <router-outlet />
</main>
