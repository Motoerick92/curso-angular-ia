<!-- ═══════════════════════════════════════════════════════════
     LAYOUT PREMIUM (Paso 3 del rebuild UI)
     Sidebar gradiente + topbar sticky con buscador + main max-w-7xl
     ═══════════════════════════════════════════════════════════ -->
<div class="flex min-h-screen">

  <!-- ── SIDEBAR: gradiente oscuro, iconos, activo con indigo ── -->
  <aside class="w-64 shrink-0 border-r border-border bg-linear-to-b from-bg-panel to-bg-app
                sticky top-0 h-screen overflow-y-auto">
    <!-- Logo / marca del curso -->
    <div class="flex items-center gap-3 px-5 py-5 border-b border-border">
      <span class="text-2xl">🅰️</span>
      <div>
        <p class="font-bold text-text leading-tight">Curso Angular 22</p>
        <p class="text-xs text-text-muted">+ IA integrada</p>
      </div>
    </div>

    <!-- Navegación de módulos: lista reactiva filtrada por el buscador -->
    <nav class="p-3 space-y-1">
      @for (m of modulosVisibles(); track m.ruta) {
        <a [routerLink]="m.ruta"
           routerLinkActive="!bg-primary !text-white shadow-(--shadow)"
           [routerLinkActiveOptions]="{ exact: m.exacto ?? false }"
           class="flex items-center gap-3 rounded-md px-3 py-2 text-sm
                  text-text-muted transition-all duration-200
                  hover:bg-primary/15 hover:text-text">
          <span>{{ m.icono }}</span>
          {{ m.nombre }}
        </a>
      }

      @if (modulosVisibles().length === 0) {
        <p class="px-3 py-2 text-xs text-text-faint italic">
          Sin módulos para "{{ textoBusqueda() }}".
        </p>
      }
    </nav>
  </aside>

  <!-- ── COLUMNA DERECHA: topbar + contenido ── -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Topbar sticky: buscador + sesión -->
    <header class="sticky top-0 z-10 flex items-center gap-4 px-6 py-3
                   border-b border-border bg-bg-app/80 backdrop-blur">
      <!-- Buscador: RxJS debounce → filtra el sidebar -->
      <div class="relative flex-1 max-w-md">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-faint">🔎</span>
        <input [formControl]="busqueda"
               placeholder="Buscar módulo…"
               class="w-full rounded-md border border-border bg-bg-panel pl-9 pr-4 py-2
                      text-sm text-text placeholder:text-text-faint
                      transition-all duration-200
                      focus:border-primary focus:ring-2 focus:ring-primary/40 focus:outline-none" />
      </div>

      <div class="flex-1"></div>

      <!-- Sesión: avatar con inicial + login/logout -->
      @if (auth.logueado()) {
        <div class="flex items-center gap-3">
          <!-- Avatar: gradiente de marca con inicial -->
          <div class="flex items-center justify-center w-9 h-9 rounded-full
                      bg-(image:--gradient-brand) text-white font-bold">
            {{ inicialUsuario() }}
          </div>
          <span class="text-sm text-text-muted hidden sm:block">{{ auth.usuario() }}</span>
          <button (click)="auth.logOut()"
                  class="text-xs text-text-muted hover:text-text transition-colors">
            Salir
          </button>
        </div>
      } @else {
        <div class="flex items-center gap-2">
          <input #loginInput
                 placeholder="Tu nombre"
                 (keyup.enter)="auth.logIn(loginInput.value)"
                 class="rounded-md border border-border bg-bg-panel px-3 py-1.5 text-sm text-text
                        placeholder:text-text-faint focus:border-primary focus:outline-none w-40" />
          <button (click)="auth.logIn(loginInput.value)"
                  class="rounded-md bg-(image:--gradient-brand) px-4 py-1.5 text-sm text-white
                         font-medium transition-all duration-200 hover:-translate-y-0.5 shadow-(--shadow)">
            Entrar
          </button>
        </div>
      }
    </header>

    <!-- Contenido: contenedor max-w-7xl centrado, sin fondo blanco -->
    <main class="flex-1 px-6 py-8">
      <div class="max-w-7xl mx-auto">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
